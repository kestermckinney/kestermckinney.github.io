<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
  </defs>

  <!-- Left cylinder (local SQLite) -->
  <rect x="6" y="16" width="18" height="32" fill="url(#g)" fill-opacity="0.5"/>
  <ellipse cx="15" cy="48" rx="9" ry="3.5" fill="url(#g)" fill-opacity="0.7"/>
  <path d="M6,32 A9,3.5 0 0,0 24,32" stroke="url(#g)" stroke-width="1.2" stroke-opacity="0.6"/>
  <ellipse cx="15" cy="16" rx="9" ry="3.5" fill="url(#g)"/>

  <!-- Right cylinder (remote PostgreSQL) -->
  <rect x="40" y="16" width="18" height="32" fill="url(#g)" fill-opacity="0.5"/>
  <ellipse cx="49" cy="48" rx="9" ry="3.5" fill="url(#g)" fill-opacity="0.7"/>
  <path d="M40,32 A9,3.5 0 0,0 58,32" stroke="url(#g)" stroke-width="1.2" stroke-opacity="0.6"/>
  <ellipse cx="49" cy="16" rx="9" ry="3.5" fill="url(#g)"/>

  <!-- Push arrow → -->
  <line x1="27" y1="26" x2="37" y2="26" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M34,23 L37,26 L34,29" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pull arrow ← -->
  <line x1="27" y1="40" x2="37" y2="40" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M30,37 L27,40 L30,43" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
